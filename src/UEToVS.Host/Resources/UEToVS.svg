<?xml version="1.0" encoding="UTF-8"?>
<!--
  UEToVS brand mark (source of Resources/UEToVS16.png, UEToVS32.png, Icon.png 128, PreviewImage.png 256).
  Same geometry as src/UEToVS.UI/Atoms/BrandMark.cs: indigo-to-blue rounded tile, white "U" whose right stem ends
  in an upward chevron ("jump to"). Designed on a 16 px grid; re-export with Resources/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4FE8"/>
      <stop offset="1" stop-color="#1F7AE0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" ry="3.5" fill="url(#g)"/>
  <path d="M 4.6,4 L 4.6,8.4 A 3,3 0 0 0 10.6,8.4 L 10.6,6.2" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8.9,4.9 L 10.6,3.3 L 12.3,4.9" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
