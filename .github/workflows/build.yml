name: Build

# PR：跑测试、打包 VSIX，并检查改了代码的 PR 是否在 CHANGELOG.md 顶部加了新版本。
# 合并到 main：如果 CHANGELOG.md 最上面的版本还没有发布，自动打包并发布 Release（说明由该版本那一节生成）。

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 tag 和历史：生成“完整改动”链接、检查版本是否已发布

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Check changelog
        if: github.event_name == 'pull_request'
        run: python scripts/release.py check-pr --base origin/${{ github.base_ref }}

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python scripts/release.py stamp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          $released = git tag --list "v$v"
          "released=$([bool]$released)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Version $v (already released: $([bool]$released))"

      - name: Test
        shell: pwsh
        run: |
          # Run every test project, then fail once with the list (one CI run shows all broken projects).
          $failed = @()
          Get-ChildItem tests -Filter *.csproj -Recurse | ForEach-Object {
            dotnet test $_.FullName -c Release
            if ($LASTEXITCODE -ne 0) { $failed += $_.BaseName }
          }
          if ($failed.Count -gt 0) { Write-Host "Failed test projects: $($failed -join ', ')"; exit 1 }

      - name: Build VSIX
        run: msbuild src\UEToVS.Host\UEToVS.Host.csproj /restore /p:Configuration=Release /p:DeployExtension=false /v:minimal

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path src\UEToVS.Host\bin -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "UEToVS-${{ steps.ver.outputs.version }}.vsix"
          Copy-Item $vsix.FullName "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline dist\SHA256SUMS
          python scripts/release.py notes --out dist\RELEASE_NOTES.md --repo "${{ github.repository }}" --vsix $name
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "VSIX: $name ($([math]::Round($vsix.Length / 1MB, 1)) MB) sha256=$hash"
          Get-Content dist\RELEASE_NOTES.md -Encoding utf8 | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: UEToVS-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "dist\${{ steps.pkg.outputs.name }}" dist\SHA256SUMS `
            --target $env:GITHUB_SHA --title "UEToVS v$v" --notes-file dist\RELEASE_NOTES.md
